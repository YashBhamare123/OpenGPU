name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.3
      - name: Shell syntax
        run: bash -n start.sh entrypoint.sh scripts/run-tests.sh scripts/opengpu-storage-init scripts/install-storage-helper
      - name: Python syntax
        run: python -m py_compile api.py admin.py config.py database.py mailer.py manager.py scheduler.py security.py
      - name: Ruff
        run: python -m ruff check api.py admin.py config.py database.py mailer.py manager.py scheduler.py security.py tests

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opengpu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opengpu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install control-plane dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          TEST_MODE: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opengpu_test
        run: scripts/run-tests.sh
