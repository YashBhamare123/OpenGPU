services:
  postgres:
    image: postgres:16
    container_name: opengpu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opengpu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in postgres.env}
      POSTGRES_DB: ${POSTGRES_DB:-opengpu}
    ports:
      - "127.0.0.1:${OPENGPU_PGPORT:-5432}:5432"
    volumes:
      - opengpu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengpu -d opengpu"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  opengpu-postgres:
